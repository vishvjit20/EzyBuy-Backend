server:
  port: 8079

spring:
  application:
    name: CONFIG-SERVER
  cloud:
    config:
      server:
        git:
          uri: ${GITHUB_URL}
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_PASSWORD}
          defaultLabel: main

eureka:
  instance:
    preferIpAddress: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
